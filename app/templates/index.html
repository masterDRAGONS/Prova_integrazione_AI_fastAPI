{% extends "base.html" %}

{% block title %}Chat AI - Domanda{% endblock %}

{% block styles %}
<style>
    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
    }

    textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
        min-height: 120px;
        transition: border-color 0.3s;
    }

    textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
        transform: translateY(0);
    }

    .loading {
        display: none;
        text-align: center;
        color: #667eea;
        margin-top: 20px;
    }

    .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e0e0e0;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<h1>💬 Chat AI</h1>
<p class="subtitle">Fai una domanda e riceverai una risposta istantanea</p>

<form method="post" action="/" id="chatForm">
    <div class="form-group">
        <label for="prompt">La tua domanda:</label>
        <textarea
            id="prompt"
            name="prompt"
            placeholder="Scrivi qui la tua domanda..."
            required
        ></textarea>
    </div>

    <button type="submit">Invia domanda 🚀</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Elaborando la tua domanda...</p>
    </div>
</form>

<script>
    document.getElementById('chatForm').addEventListener('submit', function(e) {
        document.getElementById('loading').style.display = 'block';
    });
</script>
{% endblock %}
