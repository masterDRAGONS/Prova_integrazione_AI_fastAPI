{% extends "base.html" %}

{% block title %}Chat AI - Risposta{% endblock %}

{% block styles %}
<style>
    .chat-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .message {
        padding: 15px;
        border-radius: 8px;
        word-wrap: break-word;
    }

    .user-message {
        background: #f0f0f0;
        margin-left: 20px;
        border-left: 4px solid #667eea;
    }

    .user-label {
        font-weight: 600;
        color: #667eea;
        margin-bottom: 8px;
        font-size: 12px;
        text-transform: uppercase;
    }

    .ai-message {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        margin-right: 20px;
        border-radius: 8px;
    }

    .ai-label {
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 12px;
        text-transform: uppercase;
        opacity: 0.9;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-top: 30px;
    }

    .btn {
        flex: 1;
        padding: 12px;
        border: 2px solid #667eea;
        background: white;
        color: #667eea;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        transition: all 0.3s;
    }

    .btn:hover {
        background: #667eea;
        color: white;
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<h1>💬 Chat AI</h1>
<p class="subtitle">La tua conversazione</p>

<div class="chat-container">
    <div class="message user-message">
        <div class="user-label">👤 Tu</div>
        {{ prompt }}
    </div>

    <div class="message ai-message">
        <div class="ai-label">🤖 AI</div>
        {{ response }}
    </div>
</div>

<div class="actions">
    <a href="/" class="btn btn-primary">Nuova domanda</a>
    <button class="btn" onclick="copyToClipboard('{{ response }}')">Copia risposta 📋</button>
</div>

<script>
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('Risposta copiata! 📋');
        });
    }
</script>
{% endblock %}
